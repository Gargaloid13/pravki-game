<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правки, бегом!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151920}body{display:grid;place-items:center;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.stage{position:relative;width:min(100vw,200dvh);aspect-ratio:2;background:#d5dfbf;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;user-select:none;outline:none;-webkit-tap-highlight-color:transparent}#restart{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font:500 clamp(12px,2.1vw,21px) ui-monospace,monospace;color:#382316;background:#f2bd65;border:3px solid #6a4329;box-shadow:0 5px 0 #6a4329;padding:12px 24px;cursor:pointer;touch-action:manipulation;white-space:nowrap}#restart:active{margin-top:3px;box-shadow:0 2px 0 #6a4329}#restart:focus-visible{outline:3px solid #fff;outline-offset:4px}#jump-hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);padding:7px 12px;background:rgba(44,53,49,.88);color:#f8edd7;font:clamp(11px,1.7vw,17px) ui-monospace,monospace;white-space:nowrap;pointer-events:none}#jump-hint kbd{font:inherit;color:#ffce80}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:500px){#restart{padding:8px 14px;border-width:2px}}
.touch-hint{display:none}@media(hover:none) and (pointer:coarse){.keyboard-hint{display:none}.touch-hint{display:inline}}
</style>
<main class="stage" aria-label="Игра «Правки, бегом!»"><canvas id="game" width="1000" height="500" tabindex="0" aria-label="Бег и прыжки. Нажми пробел или коснись игрового поля. Удерживай для более высокого прыжка."></canvas><div id="jump-hint" aria-hidden="true"><kbd class="keyboard-hint">ПРОБЕЛ</kbd><kbd class="touch-hint">ТАП</kbd><span> — прыгать</span></div><button id="restart" hidden>Начать заново</button><div id="status" class="sr-only" role="status" aria-live="polite">Загрузка</div><div id="end" class="sr-only" role="status" hidden></div></main>
<script src="physics.js?v=7"></script><script src="rules.js?v=7"></script><script src="pixel.js?v=7"></script><script src="gait.js?v=7"></script><script src="game.js?v=9"></script>
</html>
